<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MetroForge</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>

<body>

<div id="game">

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">M</div>

            <div>
                <div class="brand-name">METROFORGE</div>
                <div class="brand-sub">CITY SIMULATION</div>
            </div>
        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-label">TREASURY</span>
                <span class="stat-value" id="money">$50,000</span>
            </div>

            <div class="stat">
                <span class="stat-label">POPULATION</span>
                <span class="stat-value" id="population">0</span>
            </div>

            <div class="stat">
                <span class="stat-label">JOBS</span>
                <span class="stat-value" id="jobs">0</span>
            </div>

            <div class="stat">
                <span class="stat-label">HAPPINESS</span>
                <span class="stat-value" id="happiness">75%</span>
            </div>

        </div>

    </header>


    <aside class="toolbar">

        <div class="toolbar-title">BUILD</div>

        <button class="tool active" data-tool="select">
            <span class="tool-icon">⌁</span>
            Select
        </button>

        <button class="tool" data-tool="road">
            <span class="tool-icon">╋</span>
            Roads
        </button>

        <button class="tool" data-tool="residential">
            <span class="tool-icon">⌂</span>
            Residential
        </button>

        <button class="tool" data-tool="commercial">
            <span class="tool-icon">▦</span>
            Commercial
        </button>

        <button class="tool" data-tool="industrial">
            <span class="tool-icon">▤</span>
            Industrial
        </button>

        <div class="divider"></div>

        <button class="tool" data-tool="bulldoze">
            <span class="tool-icon">×</span>
            Bulldoze
        </button>

        <div class="divider"></div>

        <button class="tool" id="saveButton">
            <span class="tool-icon">↓</span>
            Save City
        </button>

        <button class="tool" id="loadButton">
            <span class="tool-icon">↑</span>
            Load City
        </button>

        <button class="tool" id="newButton">
            <span class="tool-icon">+</span>
            New City
        </button>

    </aside>


    <aside class="right-panel">

        <div class="panel-heading">CITY OVERVIEW</div>

        <div class="selected-name" id="selectedName">
            No Selection
        </div>

        <div class="selected-type" id="selectedType">
            Select an object
        </div>

        <div id="selectedInfo"></div>

        <div class="demand-box">

            <div class="panel-heading">DEMAND</div>

            <div class="demand-row">
                <div class="demand-header">
                    <span>Residential</span>
                    <span id="resDemandText">65%</span>
                </div>

                <div class="demand-track">
                    <div class="demand-fill" id="resDemand"></div>
                </div>
            </div>

            <div class="demand-row">
                <div class="demand-header">
                    <span>Commercial</span>
                    <span id="comDemandText">45%</span>
                </div>

                <div class="demand-track">
                    <div class="demand-fill" id="comDemand"></div>
                </div>
            </div>

            <div class="demand-row">
                <div class="demand-header">
                    <span>Industrial</span>
                    <span id="indDemandText">55%</span>
                </div>

                <div class="demand-track">
                    <div class="demand-fill" id="indDemand"></div>
                </div>
            </div>

        </div>

    </aside>


    <div class="bottom">

        <div>
            <div class="tool-status" id="toolStatus">
                SELECT TOOL
            </div>

            <div class="tool-description" id="toolDescription">
                Click an object to inspect it.
            </div>
        </div>

        <div class="time-controls">

            <button class="time-btn active" data-speed="0">
                II
            </button>

            <button class="time-btn" data-speed="1">
                1x
            </button>

            <button class="time-btn" data-speed="2">
                2x
            </button>

            <button class="time-btn" data-speed="3">
                3x
            </button>

            <div class="clock" id="clock">
                DAY 1 08:00
            </div>

        </div>

    </div>


    <div id="notification"></div>

    <div id="buildPreview"></div>

</div>

<script src="script.js"></script>

</body>
</html>
